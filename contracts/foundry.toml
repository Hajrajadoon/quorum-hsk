[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[rpc_endpoints]
hsk_mainnet = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[etherscan]
hsk_mainnet = { key = "blockscout", url = "https://hsk.blockscout.com/api", chain = 177 }
hsk_testnet = { key = "blockscout", url = "https://testnet-explorer.hsk.xyz/api", chain = 133 }

[fmt]
line_length = 120
